name: Weekly arXiv Scan → Auto PR

on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
    # Allow manual trigger too

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run weekly arXiv scan
        id: scan
        run: |
          python scripts/search_recent_papers.py \
            --days 7 \
            --check-existing papers/ \
            --output new_papers.json

      - name: Check for new papers
        id: check
        run: |
          if [ -f new_papers.json ] && [ -s new_papers.json ]; then
            COUNT=$(python3 -c "import json; print(len(json.load(open('new_papers.json'))))")
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "count=0" >> $GITHUB_OUTPUT
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate paper files
        if: steps.check.outputs.found == 'true'
        run: |
          python scripts/search_recent_papers.py \
            --days 7 \
            --check-existing papers/ \
            --generate papers/ \
            --output new_papers.json

      - name: Create Pull Request
        if: steps.check.outputs.found == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "📄 Weekly update: ${{ steps.check.outputs.count }} new paper(s)"
          title: "📄 Weekly arXiv Update — ${{ steps.check.outputs.count }} new paper(s)"
          body: |
            ## 🤖 Automated Weekly Paper Scan

            **Date**: $(date -u '+%Y-%m-%d')
            **New papers found**: ${{ steps.check.outputs.count }}

            This PR was automatically generated by the weekly arXiv scan workflow.

            ### Changes
            - New papers added to `papers/` directory
            - See `new_papers.json` for raw search results

            ### Review Checklist
            - [ ] Verify each new paper relates to VLA / Skill-RL / Robot Learning
            - [ ] Check arXiv IDs are correct
            - [ ] Approve and merge if everything looks good
          branch: weekly-update-${{ github.run_number }}
          base: main
          labels: |
            automated
            weekly-update
          delete-branch: true

      - name: No new papers found
        if: steps.check.outputs.found == 'false'
        run: echo "✅ No new papers found this week. Nothing to update."